<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steel Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: command-console shell — slim link banner, top bar with nav + wallet, one screen at a time below. Battle takes the whole viewport. */
:root {
  --bg: #0b1016; --panel: #121a22; --panel2: #18222c; --line: #263340; --line2: #33424f;
  --fg: #e2e8ee; --muted: #8796a4; --dim: #5d6c79;
  --accent: #ff9a3c; --accent2: #ffb86a; --steel: #7fb4dc; --gold: #f2b84a; --good: #5fd39a; --bad: #ff6a5a;
  --own: #46b2ff; --foe: #ff5b4a;
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.02em; margin: 0; text-wrap: balance; line-height: 1.05; }
h2 { font-size: 30px; } h3 { font-size: 21px; } h4 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 18px 0 8px; }
p { margin: 6px 0; }
.eyebrow { font: 600 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--steel); display: block; margin-bottom: 6px; }
.eyebrow.hot { color: var(--accent); } .eyebrow.gold, .gold { color: var(--gold); }
.muted { color: var(--muted); } .small { font-size: 13px; } .accent { color: var(--accent2); }
hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

#app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); }
.chrome-link { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 7px 16px; background: linear-gradient(90deg, #2a1708, #3a200c 50%, #2a1708); color: var(--accent2); text-decoration: none; font: 600 13px var(--f-body); border-bottom: 1px solid #5a3412; }
.chrome-link b { font-family: var(--f-display); font-size: 15px; letter-spacing: 0.06em; color: #fff; }
.chrome-link:hover { background: #4a2a10; }
.topbar { display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: linear-gradient(#111921, #0d141b); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font: 800 24px/1 var(--f-display); letter-spacing: 0.06em; white-space: nowrap; }
.brand span { color: var(--accent); }
.nav { display: flex; gap: 0; flex-wrap: wrap; flex: 1; min-width: 0; }
.nav button { position: relative; background: none; border: 0; padding: 8px 9px; font: 600 14px var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; }
.nav button:hover { color: var(--fg); }
.nav button.on { color: var(--fg); border-color: var(--accent); }
.nav button.dot::after { content: ''; position: absolute; top: 6px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.wallet { display: flex; gap: 12px; align-items: center; font: 500 12px var(--f-mono); flex-wrap: wrap; }
.wallet span { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
.wallet i { font-style: normal; color: var(--dim); font-size: 11px; letter-spacing: 0.1em; }
.wallet .cores b { color: var(--gold); }
.wallet .boost { color: var(--good); border: 1px solid #2c5a42; padding: 2px 8px; border-radius: 3px; }
main { overflow: auto; position: relative; }
.screen { padding: 18px; max-width: 1680px; margin: 0 auto; }

.panel { background: var(--panel); border: 1px solid var(--line); padding: 16px; border-radius: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border: 1px solid var(--line2); background: var(--panel2); border-radius: 3px; font: 600 14px var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; }
.btn:hover:not(:disabled) { border-color: var(--steel); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0e02; }
.btn.primary:hover:not(:disabled) { background: var(--accent2); border-color: var(--accent2); }
.btn.gold { background: linear-gradient(#f6c860, #d99a28); border-color: #f6c860; color: #241604; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: #7a2e26; color: #ffb4aa; background: #2a1210; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.huge { width: 100%; padding: 14px; font-size: 20px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.tag { padding: 4px 10px; border: 1px solid; border-radius: 3px; font: 600 12px var(--f-mono); }
.segs { display: flex; gap: 4px; flex-wrap: wrap; }
.seg { background: var(--panel2); border: 1px solid var(--line2); padding: 8px 12px; border-radius: 3px; font: 600 14px var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; }
.seg small { font: 500 10px var(--f-mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
.seg.on { border-color: var(--accent); color: var(--accent2); }

/* home */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; min-height: calc(100vh - 150px); }
.home-hero { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; min-height: 420px; background: #0d1218; }
.hero-view, .viewport { position: absolute; inset: 0; }
.hero-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 22px 20px; pointer-events: none; text-shadow: 0 2px 12px #000; background: linear-gradient(transparent, rgba(6, 9, 13, 0.85)); }
.hero-cap .eyebrow { color: var(--accent2); }
.hero-cap h2 { font-size: 46px; }
.home-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.big { font-size: 44px; margin-bottom: 12px; }
.fac-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.fac-btn { text-align: left; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--fc); border-radius: 3px; display: flex; flex-direction: column; }
.fac-btn b { font: 700 18px var(--f-display); color: var(--fc); letter-spacing: 0.08em; }
.fac-btn span { font-size: 12px; color: var(--muted); }
.fac-btn.on { background: #1f2a36; border-color: var(--fc); }
.lineup-mini { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 12px 0; }
.lm { position: relative; background: #0e141a; border: 1px solid var(--line); border-radius: 3px; aspect-ratio: 1.6; overflow: hidden; }
.lm img { width: 100%; height: 100%; object-fit: cover; }
.lm span { position: absolute; top: 2px; left: 4px; font: 700 10px var(--f-mono); color: var(--accent2); }
.missions { display: flex; flex-direction: column; gap: 8px; }
.mission { display: flex; align-items: center; gap: 10px; }
.mission > div { flex: 1; position: relative; padding-bottom: 6px; min-width: 0; }
.mission b { display: block; font-weight: 600; }
.mission span { font: 500 12px var(--f-mono); color: var(--muted); }
.mission i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--steel); }
.mission.ready i { background: var(--good); }
.mission.done { opacity: 0.55; }
.mission em { font: 600 12px var(--f-mono); color: var(--good); font-style: normal; }
.season-mini { cursor: pointer; }
.bpbar { height: 8px; background: #0b1117; border: 1px solid var(--line); margin: 6px 0; border-radius: 2px; overflow: hidden; }
.bpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); }
.bpbar.big { height: 14px; }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(4, 7, 10, 0.78); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; backdrop-filter: blur(3px); }
.modal-box { background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 22px; max-width: 760px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 30px 80px #000a; }
.modal.wide .modal-box { max-width: 1240px; }
.setup-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.map-card { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.map-card canvas, .map-card .rand { width: 100%; aspect-ratio: 1; display: block; border-radius: 2px; background: #0b1016; image-rendering: auto; }
.map-card .rand { display: flex; align-items: center; justify-content: center; font: 800 64px var(--f-display); color: var(--accent); }
.map-card b { font: 700 16px var(--f-display); letter-spacing: 0.03em; }
.map-card span { font: 500 11px var(--f-mono); color: var(--muted); text-transform: capitalize; }
.map-card em { font-size: 11px; color: var(--steel); font-style: normal; line-height: 1.3; }
.map-card.on { border-color: var(--accent); background: #2a2016; }
.setup-foot { display: grid; grid-template-columns: auto auto 1fr; gap: 18px; margin-top: 16px; align-items: end; }
.setup-foot .go { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.result { text-align: center; }
.result h1 { font-size: 84px; letter-spacing: 0.06em; }
.result.win h1 { color: var(--gold); } .result.loss h1 { color: var(--bad); }
.res-stats, .res-rew { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 16px 0; }
.res-stats div, .res-rew div { background: var(--panel2); border: 1px solid var(--line); padding: 10px; border-radius: 3px; display: flex; flex-direction: column; }
.res-stats b, .res-rew b { font: 700 28px var(--f-display); font-variant-numeric: tabular-nums; }
.res-rew b { color: var(--accent2); }
.res-stats span, .res-rew span { font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.res-units { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; text-align: left; }
.res-units div { background: var(--panel2); border: 1px solid var(--line); padding: 6px; border-radius: 3px; display: flex; flex-direction: column; }
.res-units img { aspect-ratio: 1.6; object-fit: cover; background: #0b1016; }
.res-units b { font-size: 13px; } .res-units span { font: 500 11px var(--f-mono); color: var(--good); }

/* hangar */
.hangar { display: grid; grid-template-columns: 300px minmax(0, 1fr) 390px; gap: 14px; height: calc(100vh - 150px); min-height: 560px; }
.h-list, .h-detail { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: auto; min-width: 0; }
.h-list { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.fac-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
.h-list .fac-tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
.fac-tabs button { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-bottom: 2px solid transparent; padding: 6px; font: 700 15px var(--f-display); letter-spacing: 0.08em; color: var(--muted); display: flex; flex-direction: column; align-items: center; }
.fac-tabs button small { font: 500 11px var(--f-body); letter-spacing: 0; }
.fac-tabs button.on { color: var(--fc); border-bottom-color: var(--fc); background: #1d2732; }
.br-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
.br-tabs button { background: none; border: 1px solid var(--line); padding: 4px 9px; border-radius: 3px; font: 600 12px var(--f-mono); color: var(--muted); }
.br-tabs button.on { border-color: var(--accent); color: var(--accent2); }
.br-tabs.big button { font: 600 16px var(--f-display); letter-spacing: 0.08em; padding: 8px 16px; text-transform: uppercase; }
.h-units { display: flex; flex-direction: column; gap: 4px; }
.hu { display: grid; grid-template-columns: 84px 1fr; grid-template-rows: auto auto; column-gap: 8px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 4px; position: relative; }
.hu img { grid-row: span 2; width: 84px; height: 52px; object-fit: cover; background: #0b1016; border-radius: 2px; }
.hu b { font-size: 13px; line-height: 1.2; align-self: end; } .hu small { color: var(--muted); font-size: 11px; }
.hu .r { position: absolute; top: 4px; left: 6px; font: 700 10px var(--f-mono); color: var(--accent2); text-shadow: 0 1px 2px #000; }
.hu.on { border-color: var(--accent); background: #2a2016; }
.hu.in::after { content: 'LINEUP'; position: absolute; right: 6px; top: 4px; font: 700 9px var(--f-mono); color: var(--good); letter-spacing: 0.1em; }
.hu.ex b { color: var(--gold); }
.h-view { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #0d1218; min-width: 0; }
.viewer-canvas { display: block; cursor: grab; }
.unit-head { position: absolute; left: 0; top: 0; right: 0; padding: 14px 18px 40px; pointer-events: none; text-shadow: 0 2px 10px #000; background: linear-gradient(rgba(6, 9, 13, 0.8), transparent); }
.unit-head .eyebrow { color: var(--accent2); }
.unit-head h2 { font-size: 38px; }
.unit-head p { color: #c7d2dc; }
.lineup-bar { position: absolute; left: 12px; right: 12px; bottom: 10px; background: rgba(10, 15, 20, 0.85); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.lb { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.lbs { position: relative; aspect-ratio: 1.5; padding: 0; background: #0e141a; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.lbs img { width: 100%; height: 100%; object-fit: cover; }
.lbs span { position: absolute; right: 3px; bottom: 1px; font: 700 10px var(--f-mono); color: var(--gold); }
.lbs.empty { border-style: dashed; }
.detail { padding: 14px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.kv span { color: var(--muted); }
.stats { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
.st { display: grid; grid-template-columns: 92px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; }
.st span { color: var(--muted); }
.st i { height: 6px; background: #0b1117; border-radius: 1px; overflow: hidden; }
.st em { display: block; height: 100%; background: linear-gradient(90deg, var(--steel), #b4dcf6); }
.st b { font: 600 12px var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.abils { display: flex; flex-direction: column; gap: 4px; }
.abl { display: flex; gap: 10px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; }
.abl > b { font: 700 12px var(--f-mono); color: var(--accent2); width: 34px; text-align: center; border: 1px solid #5a3a1a; padding: 4px 0; border-radius: 2px; flex: none; }
.abl strong { display: block; font-size: 13px; } .abl span { font-size: 12px; color: var(--muted); }
.abl.lock { opacity: 0.45; }
.mods { display: flex; flex-direction: column; gap: 6px; }
.mod-tier { display: grid; grid-template-columns: 26px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: stretch; }
.mod-tier .t { font: 700 11px var(--f-mono); color: var(--dim); align-self: center; }
.mod { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mod b { font-size: 12px; line-height: 1.15; } .mod span { font-size: 11px; color: var(--muted); line-height: 1.25; } .mod em { font: 600 11px var(--f-mono); color: var(--accent2); font-style: normal; margin-top: auto; }
.mod.done { border-color: #2c5a42; background: #13241c; } .mod.done em { color: var(--good); }
.mod.open:hover { border-color: var(--accent); }
.mod.locked { opacity: 0.4; }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.skin { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-top: 2px solid var(--rc); border-radius: 3px; padding: 4px; display: flex; flex-direction: column; gap: 2px; }
.skin img { width: 100%; aspect-ratio: 2; object-fit: cover; border-radius: 2px; }
.skin span { font-size: 12px; font-weight: 600; } .skin em { font: 500 10px var(--f-mono); color: var(--good); font-style: normal; }
.skin.on { border-color: var(--accent); background: #2a2016; }

/* research */
.r-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.fac-tabs.big { flex: 1; max-width: 900px; }
.fac-tabs.big button { font-size: 20px; padding: 8px; }
.r-info { display: flex; flex-direction: column; align-items: flex-end; font: 500 13px var(--f-mono); color: var(--muted); }
.r-info b { color: var(--fg); }
.tree-wrap { overflow: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; background: radial-gradient(ellipse at top, #16202a, #0d1319); }
.tree { display: grid; grid-template-columns: 46px repeat(var(--cols), minmax(240px, 1fr)); grid-template-rows: 44px repeat(7, minmax(120px, auto)); min-width: max-content; }
.corner { border-right: 1px solid var(--line); }
.rank { display: flex; align-items: center; justify-content: center; font: 800 22px var(--f-display); color: var(--dim); border-top: 1px solid var(--line); border-right: 1px solid var(--line); }
.line-name { display: flex; align-items: center; justify-content: center; font: 700 15px var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--steel); border-right: 1px solid #1b252f; }
.cell { position: relative; display: flex; gap: 6px; justify-content: center; align-items: center; padding: 10px 8px; border-top: 1px solid #1b252f; border-right: 1px solid #1b252f; }
.cell::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #2a3846; transform: translateX(-1px); z-index: 0; }
.cell.last::before { bottom: 50%; }
.node { position: relative; z-index: 1; width: 112px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 3px; padding: 4px; display: flex; flex-direction: column; text-align: left; gap: 1px; }
.node img { width: 100%; aspect-ratio: 1.6; object-fit: cover; background: #0b1016; border-radius: 2px; }
.node b { font-size: 12px; line-height: 1.15; } .node small { font-size: 10px; color: var(--muted); }
.node em { font: 600 11px var(--f-mono); font-style: normal; color: var(--accent2); }
.node.owned { border-color: #2c5a42; } .node.owned em { color: var(--good); }
.node.buy { border-color: var(--gold); } .node.buy em { color: var(--gold); }
.node.research { border-color: var(--accent); box-shadow: 0 0 0 1px #ff9a3c33; }
.node.locked { opacity: 0.5; filter: grayscale(0.7); }
.node:hover { transform: translateY(-1px); }
.node-modal { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
.nm-view img { width: 100%; background: #0b1016; border-radius: 3px; border: 1px solid var(--line); }
.node-modal .unit-head { position: static; max-width: none; text-shadow: none; }

/* shop */
.shop { display: flex; flex-direction: column; gap: 14px; }
.shop-row { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; }
.ph { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
.timer { font: 500 13px var(--f-mono); color: var(--muted); } .timer b { color: var(--accent2); font-variant-numeric: tabular-nums; }
.panel.flash { border-color: #5a3412; background: linear-gradient(180deg, #1c150f, var(--panel)); }
.offers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.offer { position: relative; display: grid; grid-template-columns: 72px 1fr; grid-template-rows: 1fr auto; gap: 6px 10px; background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--rc, var(--line2)); border-radius: 3px; padding: 8px; }
.offer.done { opacity: 0.55; }
.o-art { grid-row: span 2; }
.o-art img, .art-boost { width: 72px; height: 72px; object-fit: cover; border-radius: 3px; background: #0b1016; display: flex; align-items: center; justify-content: center; font: 800 24px var(--f-display); color: var(--gold); }
.o-body { display: flex; flex-direction: column; min-width: 0; }
.o-body b { font-size: 14px; } .rar { font: 600 10px var(--f-mono); text-transform: uppercase; letter-spacing: 0.1em; }
.o-sub { font-size: 12px; color: var(--muted); line-height: 1.3; }
.o-buy { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.o-buy s { color: var(--dim); font: 500 12px var(--f-mono); }
.off { position: absolute; top: -6px; right: -4px; background: var(--accent); color: #1a0e02; font: 700 12px var(--f-mono); padding: 2px 6px; border-radius: 2px; z-index: 1; }
.giveaways { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
.gw { display: grid; grid-template-columns: 220px 1fr; gap: 14px; background: linear-gradient(135deg, #241c0e, var(--panel2)); border: 1px solid #6a5222; border-radius: 4px; padding: 12px; }
.gw-img img { width: 100%; aspect-ratio: 1.6; object-fit: cover; background: #0b1016; border-radius: 3px; border: 1px solid #4a3a1a; }
.gw-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gw-stats { display: flex; gap: 10px; font: 500 12px var(--f-mono); color: var(--steel); flex-wrap: wrap; margin: 4px 0 8px; }
.owned-tag { color: var(--good); font: 700 14px var(--f-mono); }
.gw.owned { opacity: 0.7; }
.daily .btn { width: 100%; margin-top: 6px; }

/* crates */
.crate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
.crate { background: linear-gradient(180deg, color-mix(in srgb, var(--cc) 18%, var(--panel)), var(--panel)); border: 1px solid color-mix(in srgb, var(--cc) 55%, var(--line)); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.crate-art { height: 130px; display: flex; align-items: center; justify-content: center; perspective: 500px; }
.box3d { width: 80px; height: 80px; position: relative; transform-style: preserve-3d; transform: rotateX(-22deg) rotateY(38deg); animation: spin 9s linear infinite; }
.box3d i { position: absolute; inset: 0; border: 2px solid var(--cc); background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--cc) 30%, #111) 0 10px, color-mix(in srgb, var(--cc) 18%, #0b0b0b) 10px 20px); }
.box3d i:nth-child(1) { transform: translateZ(40px); } .box3d i:nth-child(2) { transform: rotateY(90deg) translateZ(40px); } .box3d i:nth-child(3) { transform: rotateX(90deg) translateZ(40px); }
@keyframes spin { to { transform: rotateX(-22deg) rotateY(398deg); } }
.odds { width: 100%; border-collapse: collapse; font: 500 12px var(--f-mono); }
.odds td { padding: 2px 0; border-bottom: 1px solid var(--line); } .odds td:last-child { text-align: right; }
.excl-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
.ex { aspect-ratio: 1.5; background: #0b1016; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; filter: grayscale(1) brightness(0.45); }
.ex.have { filter: none; border-color: var(--gold); }
.ex img { width: 100%; height: 100%; object-fit: cover; }
.opening { text-align: center; }
.reel { position: relative; overflow: hidden; height: 168px; border: 1px solid var(--line2); background: #0a0f14; border-radius: 4px; margin: 10px 0; }
.marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: var(--accent); transform: translateX(-1px); z-index: 2; box-shadow: 0 0 12px var(--accent); }
.strip { display: flex; gap: 0; position: absolute; left: 0; top: 10px; will-change: transform; }
.ri { width: 132px; flex: none; padding: 0 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ri img, .ri .art-boost { width: 120px; height: 120px; object-fit: cover; border-radius: 3px; border-bottom: 4px solid var(--rc); background: #111820; }
.ri span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.rv { border: 1px solid var(--rc); border-radius: 5px; padding: 18px; background: radial-gradient(ellipse at top, color-mix(in srgb, var(--rc) 25%, transparent), transparent 70%); animation: pop 0.5s ease-out; }
.rv .rar { color: var(--rc); font-size: 14px; }
.rv-art img, .rv-art .art-boost { width: 260px; height: 160px; object-fit: cover; margin: 10px auto; display: flex; border-radius: 4px; }
@keyframes pop { from { transform: scale(0.85); opacity: 0; } }

/* battle pass */
.pass-head { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 18px; margin-bottom: 14px; align-items: end; }
.pass-head h2 { font-size: 46px; }
.pass-prog { background: var(--panel); border: 1px solid var(--line); padding: 14px; border-radius: 4px; }
.pass-prog b { font: 800 26px var(--f-display); }
.pass-prog span { font: 500 12px var(--f-mono); color: var(--muted); }
.bp-veh { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.bv { background: var(--panel2); border: 1px solid #6a5222; border-radius: 3px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.bv img { aspect-ratio: 1.6; object-fit: cover; background: #0b1016; border-radius: 2px; }
.bv b { font-size: 13px; color: var(--gold); } .bv span { font-size: 11px; color: var(--muted); }
.bv.have { border-color: var(--good); }
.bp-track { display: grid; grid-template-columns: 70px minmax(0, 1fr); margin-top: 14px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.bp-labels { display: grid; grid-template-rows: 30px 134px 134px; padding-bottom: 6px; font: 700 13px var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-right: 1px solid var(--line); }
.bp-labels span { display: flex; align-items: center; justify-content: center; }
.bp-labels span:first-child { grid-row: 2; } .bp-labels span:last-child { grid-row: 3; color: var(--gold); }
.bp-scroll { display: flex; overflow-x: auto; }
.bp-col { flex: none; width: 112px; display: grid; grid-template-rows: 30px 130px 130px; gap: 4px; padding: 0 4px 6px; border-right: 1px solid #1b252f; }
.bp-col .tn { display: flex; align-items: center; justify-content: center; font: 700 14px var(--f-mono); color: var(--dim); }
.bp-col.reached .tn { color: var(--accent2); }
.bp-c { display: flex; flex-direction: column; gap: 3px; padding: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; text-align: left; overflow: hidden; }
.bp-c img, .bp-c .art-boost { width: 100%; height: 66px; object-fit: cover; border-radius: 2px; background: #0b1016; font-size: 20px; }
.bp-c span { font-size: 11px; line-height: 1.2; color: var(--muted); }
.bp-c.p { border-color: #4a3a1a; }
.bp-c.veh { border-color: var(--gold); box-shadow: inset 0 0 0 1px #f2b84a44; }
.bp-c.ready { border-color: var(--accent); animation: glow 1.6s ease-in-out infinite; }
.bp-c.got { opacity: 0.45; }
.bp-c.got::after { content: 'CLAIMED'; font: 700 10px var(--f-mono); color: var(--good); }
.bp-c:disabled { cursor: default; }
@keyframes glow { 50% { box-shadow: 0 0 14px #ff9a3c66; } }

.profile, .settings { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.fprog { display: grid; grid-template-columns: 200px 1fr 90px; gap: 10px; align-items: center; margin: 6px 0; }
.fprog b { color: var(--fc); } .fprog span { font: 500 12px var(--f-mono); text-align: right; }
.fprog .bpbar i { background: var(--fc); }
.slider { display: grid; grid-template-columns: 170px 1fr 48px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }
.slider input { accent-color: var(--accent); width: 100%; }
.slider b { font: 500 12px var(--f-mono); text-align: right; }
.check { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.check input { accent-color: var(--accent); }

#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 80; pointer-events: none; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--steel); padding: 9px 14px; border-radius: 3px; font-size: 14px; box-shadow: 0 8px 24px #0008; transition: opacity 0.5s, transform 0.5s; max-width: 380px; }
.toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
.toast.out { opacity: 0; transform: translateX(20px); }
#loading { position: fixed; inset: 0; z-index: 60; background: radial-gradient(ellipse at center, #16202b, #070a0e); display: flex; align-items: center; justify-content: center; padding: 16px; }
.load-box { display: grid; grid-template-columns: 220px minmax(0, 420px); gap: 22px; align-items: center; }
.load-box canvas { width: 220px; height: 220px; border: 1px solid var(--line2); border-radius: 4px; }
.load-box h2 { font-size: 40px; }
.load-bar { height: 3px; background: var(--line); margin: 14px 0; overflow: hidden; }
.load-bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.fatal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--bad); padding: 30px; font-size: 18px; text-align: center; z-index: 99; }

/* battle HUD */
#battle-root { position: fixed; inset: 0; z-index: 20; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; }
.b-canvas { position: absolute; inset: 0; display: block; touch-action: none; }
.b-overlay { position: absolute; inset: 0; pointer-events: none; }
.b-top { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 10px; padding: 8px 12px; pointer-events: none; }
.b-top > * { pointer-events: auto; }
.b-res { display: flex; gap: 8px; }
.b-res > span { display: flex; align-items: baseline; gap: 5px; background: rgba(8, 12, 16, 0.78); border: 1px solid var(--line); padding: 5px 10px; border-radius: 3px; }
.b-res b { font: 700 22px var(--f-display); font-variant-numeric: tabular-nums; }
.b-res i { font: 500 11px var(--f-mono); font-style: normal; color: var(--muted); }
.b-res em { font: 500 11px var(--f-mono); color: var(--good); font-style: normal; }
.b-cp b { color: var(--gold); }
.b-tickets { display: flex; align-items: center; gap: 10px; background: rgba(8, 12, 16, 0.8); border: 1px solid var(--line); padding: 6px 12px; border-radius: 3px; }
.tk { display: flex; align-items: center; gap: 8px; }
.tk b { font: 700 24px var(--f-display); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
.tk0 b { color: var(--own); } .tk1 b { color: var(--foe); }
.tkbar { width: 120px; height: 8px; background: #0b1117; border: 1px solid var(--line); overflow: hidden; }
.tkbar span { display: block; height: 100%; }
.tk0 .tkbar { transform: scaleX(-1); } .tk0 .tkbar span { background: var(--own); } .tk1 .tkbar span { background: var(--foe); }
.b-pts { display: flex; gap: 4px; }
.pt { position: relative; width: 30px; height: 30px; border: 2px solid #cfd6dc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 15px var(--f-display); background: #1a2028; overflow: hidden; cursor: pointer; }
.pt span { position: relative; z-index: 1; }
.pt i { position: absolute; left: 0; bottom: 0; height: 4px; }
.pt.own { border-color: var(--own); background: #12324a; } .pt.foe { border-color: var(--foe); background: #4a1a14; }
.pt.contested { animation: glow 0.8s infinite; border-color: var(--gold); }
.b-right { display: flex; gap: 6px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
.b-weather, .b-clock { background: rgba(8, 12, 16, 0.78); border: 1px solid var(--line); padding: 6px 10px; border-radius: 3px; font: 600 13px var(--f-mono); }
.b-weather { color: #e8d9a8; cursor: help; }
.b-btn { background: rgba(8, 12, 16, 0.85); border: 1px solid var(--line2); padding: 5px 10px; border-radius: 3px; font: 700 13px var(--f-mono); min-width: 38px; }
.b-feed { position: absolute; right: 12px; top: 56px; width: 340px; max-width: 45vw; display: flex; flex-direction: column; gap: 3px; font-size: 13px; pointer-events: none; text-shadow: 0 1px 3px #000, 0 0 6px #000; text-align: right; }
.b-msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font: 700 22px var(--f-display); letter-spacing: 0.06em; color: var(--accent2); text-shadow: 0 2px 8px #000; opacity: 0; pointer-events: none; }
.b-msg.show { animation: msg 1.8s ease-out; }
@keyframes msg { 0% { opacity: 0; transform: translate(-50%, 8px); } 15% { opacity: 1; transform: translate(-50%, 0); } 75% { opacity: 1; } 100% { opacity: 0; } }
.b-bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 10px; padding: 10px; pointer-events: none; }
.b-bottom > * { pointer-events: auto; }
.b-mini { flex: none; background: rgba(8, 12, 16, 0.85); border: 1px solid var(--line2); padding: 4px; border-radius: 3px; }
.b-mini canvas { display: block; width: 200px; height: 200px; cursor: crosshair; }
.b-center { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; align-items: center; }
.b-sel { display: flex; gap: 10px; align-items: stretch; background: rgba(8, 12, 16, 0.86); border: 1px solid var(--line2); border-radius: 3px; padding: 8px 10px; max-width: 100%; }
.sel-info { min-width: 260px; max-width: 420px; }
.sel-name { font: 700 18px var(--f-display); letter-spacing: 0.03em; }
.sel-name small { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.sel-name .foe { color: var(--foe); font-size: 13px; }
.sel-hp { position: relative; height: 14px; background: #0b1117; border: 1px solid var(--line); margin: 5px 0; }
.sel-hp span { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #2c8ac2, var(--own)); }
.sel-hp b { position: relative; font: 600 10px/14px var(--f-mono); padding-left: 6px; }
.sel-stats { display: flex; flex-wrap: wrap; gap: 8px; font: 500 11px var(--f-mono); color: var(--steel); }
.sel-multi { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.sel-ab { display: flex; gap: 5px; align-items: center; }
.ab { position: relative; width: 54px; height: 54px; background: #1b2530; border: 1px solid #5a3a1a; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.ab b { font: 700 13px var(--f-mono); color: var(--accent2); }
.ab i { font: 600 10px var(--f-mono); color: var(--muted); font-style: normal; }
.ab em { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.66); display: flex; align-items: center; justify-content: center; font: 700 16px var(--f-mono); color: #fff; font-style: normal; }
.ab:hover { border-color: var(--accent); }
.ab.on { border-color: var(--gold); background: #3a2c10; }
.b-deploy { display: flex; gap: 4px; max-width: 100%; overflow-x: auto; padding-bottom: 2px; }
.dc { position: relative; flex: none; width: 96px; height: 92px; padding: 0; background: #121a22; border: 1px solid var(--line2); border-radius: 3px; overflow: hidden; display: flex; flex-direction: column; text-align: left; }
.dc img { width: 100%; height: 56px; object-fit: cover; background: #0b1016; }
.dc-name { font-size: 10.5px; line-height: 1.1; padding: 2px 4px 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dc-rank { position: absolute; top: 2px; left: 4px; font: 700 10px var(--f-mono); color: var(--accent2); text-shadow: 0 1px 2px #000; }
.dc-cost { position: absolute; top: 2px; right: 4px; font: 700 12px var(--f-mono); color: var(--gold); text-shadow: 0 1px 2px #000; }
.dc-pop { position: absolute; top: 38px; right: 4px; font: 600 10px var(--f-mono); color: #cfe; text-shadow: 0 1px 2px #000; }
.dc-cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); pointer-events: none; }
.dc:hover { border-color: var(--accent); }
.dc.off img { filter: grayscale(0.8) brightness(0.55); }
.dc.off .dc-cost { color: var(--bad); }
.dc.off .dc-name { color: var(--muted); }
.dc.nowater { opacity: 0.35; }
.b-tip { position: absolute; width: 260px; background: rgba(10, 14, 19, 0.96); border: 1px solid var(--line2); padding: 10px; border-radius: 3px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; z-index: 5; }
.b-tip b { font: 700 16px var(--f-display); } .b-tip span { color: var(--steel); font-family: var(--f-mono); font-size: 11px; } .b-tip p { color: var(--muted); }
.b-pausemenu { position: absolute; inset: 0; background: rgba(4, 7, 10, 0.7); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.pm-box { background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 22px; width: 480px; max-width: 100%; display: flex; flex-direction: column; gap: 8px; }
.pm-box h2 { font-size: 36px; margin-bottom: 6px; }
.pm-b { background: var(--panel2); border: 1px solid var(--line2); padding: 10px; border-radius: 3px; font: 600 16px var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; }
.pm-b:hover { border-color: var(--accent); }
.pm-b.danger { color: #ffb4aa; border-color: #7a2e26; }
.pm-help p { font-size: 13px; color: var(--muted); } .pm-help b { color: var(--fg); }
.pm-confirm { display: flex; flex-direction: column; gap: 6px; }

/* hangar tabs + customisation tree */
.htabs { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.htabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; font: 600 14px var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.htabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.ctree, .uptree { display: flex; flex-direction: column; gap: 10px; }
.ctier { border-left: 2px solid var(--line2); padding-left: 10px; }
.ct-h { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
.ct-h b { font: 700 14px var(--f-display); letter-spacing: 0.08em; color: var(--accent2); }
.ct-h span { font-size: 12px; color: var(--muted); }
.cnodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 5px; }
.cnode { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cnode .cc { font: 600 9px var(--f-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--steel); }
.cnode b { font-size: 13px; line-height: 1.15; } .cnode small { font-size: 11px; color: var(--muted); line-height: 1.25; }
.cnode em { font: 600 11px var(--f-mono); font-style: normal; color: var(--accent2); margin-top: auto; padding-top: 3px; }
.cnode.open:hover { border-color: var(--accent); }
.cnode.owned { border-color: #2c5a42; } .cnode.owned em { color: var(--good); }
.cnode.equipped { border-color: var(--good); background: #13241c; } .cnode.equipped em { color: var(--good); }
.cnode.needmod, .cnode.needtier, .cnode.nounit { opacity: 0.5; } .cnode.needmod em, .cnode.needtier em { color: var(--dim); }
/* stratagems */
.strats { display: flex; flex-direction: column; gap: 14px; }
.lslots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lslot { position: relative; background: var(--panel2); border: 1px solid var(--line2); border-left: 3px solid var(--bc, var(--line2)); border-radius: 3px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 76px; }
.lslot.empty { display: flex; align-items: center; justify-content: center; color: var(--dim); border-style: dashed; font-size: 13px; }
.lslot i { position: absolute; top: 6px; right: 8px; font: 700 12px var(--f-mono); color: var(--muted); font-style: normal; }
.lslot b { font: 700 15px var(--f-mono); color: var(--bc); } .lslot span { font-weight: 600; } .lslot small { font-size: 11px; color: var(--dim); }
.sgrid { display: grid; grid-template-columns: 46px repeat(var(--cols), minmax(170px, 1fr)); grid-template-rows: 44px repeat(6, minmax(110px, auto)); overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: radial-gradient(ellipse at top, #16202a, #0d1319); }
.snode { position: relative; z-index: 1; width: 150px; background: var(--panel2); border: 1px solid var(--line2); border-top: 3px solid var(--bc); border-radius: 3px; padding: 6px 8px; display: flex; flex-direction: column; text-align: left; gap: 1px; }
.snode .sic, .sic { font: 700 13px var(--f-mono); color: var(--bc); letter-spacing: 0.08em; }
.snode strong { font-size: 13px; line-height: 1.15; } .snode span { font: 500 11px var(--f-mono); color: var(--muted); }
.snode em { font: 600 11px var(--f-mono); font-style: normal; color: var(--accent2); }
.snode.owned em { color: var(--good); } .snode.buy em { color: var(--gold); } .snode.research { box-shadow: 0 0 0 1px #ff9a3c55; }
.snode.locked { opacity: 0.45; filter: grayscale(0.6); }
.snode.inl::after { content: 'LOADOUT'; position: absolute; top: 4px; right: 6px; font: 700 9px var(--f-mono); color: var(--good); letter-spacing: 0.1em; }
.strat-modal .sm-head { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
.sic.big { font-size: 26px; border: 2px solid var(--bc); padding: 14px 10px; border-radius: 4px; min-width: 86px; text-align: center; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
.facts div { background: var(--panel2); border: 1px solid var(--line); padding: 6px 8px; border-radius: 3px; display: flex; flex-direction: column; }
